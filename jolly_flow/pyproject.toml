[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jolly-flow"
version = "0.1.0"
description = "Interactive project planning framework CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer[all]>=0.21.1",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "langgraph>=1.0.7",
    "langchain>=1.2.7",
    "langchain-openai>=1.1.7",
    "pydantic>=2.12.5",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]

[project.scripts]
jolly-flow = "jolly_flow.main:app"
